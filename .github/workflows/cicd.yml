name: ci/cd

on:
  push:
    branches: [ main, 'release/**', 'task/**', 'feature/**', 'epic/**', 'codex/**']
    tags: ['**']
  pull_request:
    branches: [ main, 'release/**', 'task/**', 'feature/**', 'epic/**', 'codex/**']

jobs:
  builds:
    name: Erlang ${{ matrix.otp_version }} build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        otp_version: ['27.3.4.19', '28.5.0.8', '29.1.2']
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ matrix.otp_version }}
          rebar3-version: '3.27.0'
      - name: Check rebar3 version
        run: rebar3 --version
      - name: Native checks
        run: make check-native
